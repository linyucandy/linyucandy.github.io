- id: defiant-sigil
  title: 逆命纹章
  url: /works/defiant-sigil/
  cover: /images/cover-niming.svg
  genre: 奇幻与热血成长
  subtitle: 命运写在身上，选择握在手里。
  description: 在天命纹章决定天赋与阶层的世界，少年林烬被判为无纹者。濒死之际觉醒的禁忌力量，让他成为追猎的目标，也让他看见了撼动命运的可能。
  tags: [奇幻冒险, 命运与自由, 作品介绍]
  eyebrow: FANTASY / DESTINY & FREE WILL
  introduction: 从灰石镇到帝国学院，从逃亡之路到帝国风暴。力量让他拥有反抗的机会，也让每一次选择都变得更有分量。
- id: sugar-is-cold-2
  title: 糖是凉的2
  url: /works/sugar-is-cold-2/
  cover: /images/cover-sugar-2.svg
  genre: 现实成长与创业
  eyebrow: SUGAR IS COLD II / SOMEONE ANSWERS
  subtitle: 学会回应以后，怎样成为可以依靠的人。
  description: 多年以后，林屿在南京尝试做一套设备监测产品。原型、误报、交付与现金压力，把他带进合伙、工作与亲密关系的交界处。每一句承诺，都开始牵动别人的生活。
  introduction: 工程让他学会追问证据，创业让他学习尊重别人的时间。与乔宁、周岚和程望的相遇，让一个人的想法逐渐变成需要共同承担的选择。
  tags: [工程与创业, 成年人的关系, 创作中]
