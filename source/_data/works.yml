- id: the-same-star
  title: 同一颗星
  url: /works/the-same-star/
  cover: /images/cover-same-star.svg
  genre: 当代现实与技术叙事
  eyebrow: THE SAME STAR / A CONTEMPORARY NOVEL
  subtitle: 一份清单被不断转发，一个人的名字被不断改写。
  description: 技术人何长庚写下一份十六项的复核清单，却拒绝替它加上“通过／不通过”。当清单离开工作台，走进论坛、发布会与行业规范，读数之外，谁来决定它的意义？
  introduction: 一次转发、一处删改、一个要求背书的来访者。围绕同一份文件，梁昭、温琳与江衍作出各自的选择，普通人的生活与技术的去向交织在一起。
  tags: [AI与算法时代, 开源与署名, 初稿完成]
  notice: 本作初稿完成，正在修订；本站当前提供作品介绍，暂未开放试读。
