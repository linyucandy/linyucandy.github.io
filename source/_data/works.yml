- id: sugar-is-cold
  title: 糖是凉的
  url: /works/sugar-is-cold/
  cover: /images/cover-sugar.svg
  genre: 成长与情感
  subtitle: 关于沉默、错过，与漫长的成长。
  description: 幼年寄居姥姥家的林屿，记住了橘子糖的甜，也学会了等待。此后的青春、远行与归乡，那些没有说出口的话，始终伴随着他。
